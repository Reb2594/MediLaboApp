server {
    listen 80;

    # Sert les fichiers React buildés (dist/)
    root /usr/share/nginx/html;
    index index.html;

    # React Router (routes côté client) : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirige les appels /api vers la Gateway (Ocelot), à l'intérieur du réseau Docker
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
