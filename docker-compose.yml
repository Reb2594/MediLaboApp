services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MediLabo_2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "MediLabo_2026!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5

  patientservice:
    build:
      context: ./PatientService.API
      dockerfile: Dockerfile
    container_name: patientservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MediLaboDb;User Id=sa;Password=MediLabo_2026!;TrustServerCertificate=True
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - microservices-network

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-network

  noteservice:
    build:
      context: ./NoteService.API
      dockerfile: Dockerfile
    container_name: noteservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MongoDbSettings__ConnectionString=mongodb://mongodb:27017
    ports:
      - "5002:8080"
    depends_on:
      - mongodb
    networks:
      - microservices-network

  authservice:
    build:
      context: ./AuthService.API
      dockerfile: Dockerfile
    container_name: authservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5003:8080"
    networks:
      - microservices-network

  diabetesriskservice:
    build:
      context: ./DiabetesRiskService.API
      dockerfile: Dockerfile
    container_name: diabetesriskservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Services__PatientServiceUrl=http://patientservice:8080/
      - Services__NoteServiceUrl=http://noteservice:8080/
    ports:
      - "5004:8080"
    depends_on:
      - patientservice
      - noteservice
    networks:
      - microservices-network

  gateway:
    build:
      context: ./Gateway.API
      dockerfile: Dockerfile
    container_name: gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5000:8080"
    depends_on:
      - patientservice
      - authservice
      - noteservice
      - diabetesriskservice
    networks:
      - microservices-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  sqlserver_data:
  mongodb_data:
